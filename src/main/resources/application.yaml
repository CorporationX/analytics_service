app:
  redis:
    topic:
      comment-analytics: comment_analytics_topic
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel

  kafka:
    consumer:
      enable-auto-commit: false
      isolation-level: "read-committed"
      auto.offset.reset: "latest"

      topics:
        premium-topic: "premium-analytics-topic"

      groups:
        premium-group: "premium-analytics-group"

    listener:
      ack-mode: "manual"

server:
  port: 8086

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
