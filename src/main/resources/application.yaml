spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-group
    topics:
      comment-topic:
        name: analytics_comment_topic
      like-topic:
        name: analytics-like-events
      user-profile-view-topic:
        name: analytics_user_view_profile_topic
      post-view-topic:
        name: analytics_post_view_topic

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel

server:
  port: 8086

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
