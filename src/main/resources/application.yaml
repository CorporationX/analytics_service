spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytic-service-group
    topics:
      goal-completed-topic:
        name: goal-completed
      subscription:
        new-follower-topic:
          name: new-follower-events
        unfollow-topic:
          name: unfollow-events
      profile:
        name: view-profile
      recover:
        name: transfer-events-dlt
      event-start-topic:
        name: event-start
      comment-topic:
        name: comment-event

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel

server:
  port: 8086

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
