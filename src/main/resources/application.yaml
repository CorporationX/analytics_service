spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        profile-view: profile_view_channel
        goal-complete: goal_complete
        recommendation-event: recommendation_event
        like-event: like_event
        comment-topic: comment_topic
        premium-bought: premium_bought
    kafka:
      use-kafka: true
      bootstrap-servers: localhost:9092, localhost:9192, localhost:9292

server:
  port: 8086

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
