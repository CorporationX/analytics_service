spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel

  kafka:
    bootstrap-servers: localhost:9092

  lifecycle:
    timeout-per-shutdown-phase: 1s

server:
  port: 8086
  shutdown: graceful

kafka:
  consumers:
    profile-view:
      topic: analytics.profile-view
      group-id: profile-view-group
      concurrency: 3
    post-view:
      topic: analytics.post-view
      group-id: post-view-group
      concurrency: 3
    comment:
      topic: analytics.comment-analysis
      group-id: comment-analysis-group
      concurrency: 3

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
