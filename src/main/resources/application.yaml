spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel

  kafka:
    bootstrap:
      server:
        address: localhost:9092
    topics:
      analytic-topics:
        add-like-topic-name: "user-like-post"
        listener-group: "group-1"
    consumer:
      retry-interval-ms: 5000
      max-attempts: 5

server:
  port: 8086

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
