spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel
        project-view: project_view_channel
        follower: follower_channel
        post-published: post_published_channel
        post-view: post_view_channel
        post-like: post_like_channel
        post-comment: post_comment_channel
        skill-received: skill_received_channel
        recommendation-received: recommendation_received_channel
        added-to-favorites: added_to_favorites_channel
        project-invite: project_invite_channel
        task-completed: task_completed_channel
        goal-completed: goal_completed_channel
        achievement-received: achievement_received_channel
        profile-appeared-research: profile_appeared_research
        project-appeared-research: project_appeared_research

server:
  port: 8086

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
