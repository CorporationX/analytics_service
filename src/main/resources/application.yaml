spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  config:
    import: classpath:kafka-topics.yaml

kafka:
  consumer:
    group-id: "notification-group"
    bootstrap-servers: "localhost:9092"
    retry-interval-ms: 5000
    max-attempts: 5

user-profile-viewed:
  topic-name: "user-profile-viewed"


  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel

server:
  port: 8086

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
