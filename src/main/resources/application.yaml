spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel

audit-kafka:
  enabled: true
  backoff:
    init-interval: 1000
    max-retries: 2
    max-interval: 5000
    multiplier: 2
  consumer:
    group-id: events
  topic: analiticsEvent

server:
  port: 8086

logging:
  level:
    root: info

integration:
  user-service:
    host: localhost
    port: 8888
    get-user-url: /api/user
  project-service:
    host: ${PROJECT_SERVICE_HOST:localhost}
    port: 8082
    get-project-url: /api/project
  post-service:
    host: localhost
    port: 8081
    get-user-url: /api/post
  achievment-service:
    host: localhost
    port: 8085
    get-user-url: /api/achievment
  payment-service:
    host: localhost
    port: 9080