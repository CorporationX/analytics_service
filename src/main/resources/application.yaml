spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel
        goal-completing-channel: goal-completing-channel
        PostViewEvent: PostViewEvent_topic
        FundRaised: fundRaised_topic
        mentorship-request-channel: mentorship-request-channel
        follower: follower_channel
        project-view: project_view_channel
    kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group-id: analytics-group
        auto-offset-reset: earliest
      producer:
        acks: "1"
      topics:
        hashtag-analytics:
          name: "hashtag-analytics"
          partitions: 3
          replicas: 1

  profiles:
    active: local

server:
  port: 8086

logging:
  level:
    root: debug

project-service:
  host: localhost
  port: 8082
