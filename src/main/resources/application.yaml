spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  config:
    import: 'optional:consul:'
  application:
    name: analytics-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery: analytics-service-i1
      config:
        enabled: true
        watch:
          enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel

server:
  port: 8086

logging:
  level:
    root: info

services:
  project-service:
    name: project-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,refresh
